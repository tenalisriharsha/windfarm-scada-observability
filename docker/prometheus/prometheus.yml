global:
  scrape_interval: 5s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/windfarm.rules.yml

scrape_configs:
  - job_name: windfarm-collector
    static_configs:
      - targets: ["collector:9200"]
